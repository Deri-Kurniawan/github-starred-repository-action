name: Test GitHub Starred Repository Action

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public:
    name: Test Public Mode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate public starred repositories
        id: starred
        uses: ./
        with:
          username: Deri-Kurniawan
          output-file: test-output/public/REPOSITORY_STAR_LIST.md
          digest-file: test-output/public/REPOSITORY_STAR_DIGEST.md

      - name: Verify generated files
        run: |
          test -f test-output/public/REPOSITORY_STAR_LIST.md
          test -f test-output/public/REPOSITORY_STAR_DIGEST.md

          test -s test-output/public/REPOSITORY_STAR_LIST.md
          test -s test-output/public/REPOSITORY_STAR_DIGEST.md

      - name: Display result
        run: |
          echo "Repositories: ${{ steps.starred.outputs.count }}"
          echo "File: ${{ steps.starred.outputs.file }}"
          echo "Digest: ${{ steps.starred.outputs.digest-file }}"

  test-authenticated:
    name: Test Authenticated Mode
    runs-on: ubuntu-latest

    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate authenticated starred repositories
        id: starred
        uses: ./
        with:
          username: Deri-Kurniawan
          output-file: test-output/authenticated/REPOSITORY_STAR_LIST.md
          digest-file: test-output/authenticated/REPOSITORY_STAR_DIGEST.md
          token: ${{ secrets.STARRED_REPOSITORIES_TOKEN }}

      - name: Verify generated files
        run: |
          test -f test-output/authenticated/REPOSITORY_STAR_LIST.md
          test -f test-output/authenticated/REPOSITORY_STAR_DIGEST.md

          test -s test-output/authenticated/REPOSITORY_STAR_LIST.md
          test -s test-output/authenticated/REPOSITORY_STAR_DIGEST.md