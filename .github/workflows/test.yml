name: Test GitHub Starred Repository Action

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate starred repository list
        id: starred
        uses: ./
        with:
          username: Deri-Kurniawan
          output-file: test-output/REPOSITORY_STAR_LIST.md
          group-by: language
          sort-by: stars
          sort-order: desc
          format: table
          token: ${{ github.token }}

      - name: Verify generated file
        run: |
          test -f test-output/REPOSITORY_STAR_LIST.md

      - name: Display action outputs
        run: |
          echo "Total repositories: ${{ steps.starred.outputs.count }}"
          echo "Generated file: ${{ steps.starred.outputs.file }}"

      - name: Display generated Markdown
        run: |
          cat test-output/REPOSITORY_STAR_LIST.md