name: Test GitHub Starred Repository Action

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate starred repository files
        id: starred
        uses: ./
        with:
          username: Deri-Kurniawan
          output-file: test-output/REPOSITORY_STAR_LIST.md
          digest-file: test-output/REPOSITORY_STAR_DIGEST.md
          token: ${{ secrets.STARRED_REPOSITORIES_TOKEN }}

      - name: Verify star list
        run: |
          test -f test-output/REPOSITORY_STAR_LIST.md

      - name: Verify digest
        run: |
          test -f test-output/REPOSITORY_STAR_DIGEST.md

      - name: Verify generated files are not empty
        run: |
          test -s test-output/REPOSITORY_STAR_LIST.md
          test -s test-output/REPOSITORY_STAR_DIGEST.md

      - name: Display action outputs
        run: |
          echo "Total repositories: ${{ steps.starred.outputs.count }}"
          echo "Star list: ${{ steps.starred.outputs.file }}"
          echo "Digest: ${{ steps.starred.outputs.digest-file }}"

      - name: Display generated star list
        run: |
          cat test-output/REPOSITORY_STAR_LIST.md

      - name: Display generated digest
        run: |
          cat test-output/REPOSITORY_STAR_DIGEST.md