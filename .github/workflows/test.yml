name: Test GitHub Starred Knowledge Base Action

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate starred knowledge base
        id: starred
        uses: ./
        with:
          username: Deri-Kurniawan
          markdown-file: test-output/STARRED_REPOSITORIES.md
          knowledge-base-file: test-output/STARRED_REPOSITORIES.txt
          sort-by: name
          sort-order: asc

      - name: Verify generated files
        run: |
          test -f test-output/STARRED_REPOSITORIES.md
          test -f test-output/STARRED_REPOSITORIES.txt

          test -s test-output/STARRED_REPOSITORIES.md
          test -s test-output/STARRED_REPOSITORIES.txt

      - name: Verify Markdown output
        run: |
          grep -q "# Starred Repositories" \
            test-output/STARRED_REPOSITORIES.md

          grep -q "github-starred-knowledge-base-action" \
            test-output/STARRED_REPOSITORIES.md

      - name: Verify AI knowledge base
        run: |
          grep -q "# GitHub Starred Knowledge Base" \
            test-output/STARRED_REPOSITORIES.txt

          grep -q "github-starred-knowledge-base-action" \
            test-output/STARRED_REPOSITORIES.txt

      - name: Show results
        run: |
          echo "Repositories fetched: ${{ steps.starred.outputs.count }}"
          echo "Markdown: ${{ steps.starred.outputs.markdown-file }}"
          echo "Knowledge Base: ${{ steps.starred.outputs.knowledge-base-file }}"