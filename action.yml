name: GitHub Starred Repository Knowledge Base
description: Generate a human-readable Markdown table and a compact AI-ready text knowledge base from GitHub starred repositories.
author: Deri Kurniawan

branding:
  icon: star
  color: yellow

inputs:
  username:
    description: GitHub username whose starred repositories should be fetched.
    required: true

  output-file:
    description: Path and filename of the generated Markdown repository table.
    required: false
    default: REPOSITORY_STAR_LIST.md

  digest-file:
    description: Path and filename of the compact AI-ready repository digest.
    required: false
    default: REPOSITORY_STAR_DIGEST.txt

  sort-by:
    description: Sort repositories by name, stars, or updated.
    required: false
    default: name

  sort-order:
    description: Sort order, either asc or desc.
    required: false
    default: asc

  token:
    description: Optional GitHub token for authenticated API requests.
    required: false

outputs:
  count:
    description: Total number of starred repositories fetched.

  file:
    description: Path of the generated Markdown table.

  digest-file:
    description: Path of the generated AI-ready text digest.

runs:
  using: node24
  main: dist/index.js