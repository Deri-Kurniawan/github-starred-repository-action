name: GitHub Starred Knowledge Base

description: Turn GitHub starred repositories into a human-readable Markdown list and a compact AI-ready knowledge base.

author: Deri Kurniawan

branding:
  icon: book-open
  color: yellow

inputs:
  username:
    description: GitHub username whose starred repositories should be fetched.
    required: true

  markdown-file:
    description: Path and filename of the generated human-readable Markdown repository list.
    required: false
    default: STARRED_REPOSITORIES.md

  knowledge-base-file:
    description: Path and filename of the generated compact AI-ready knowledge base.
    required: false
    default: STARRED_REPOSITORIES.txt

  sort-by:
    description: Sort repositories by name, stars, or updated.
    required: false
    default: name

  sort-order:
    description: Sort order, either asc or desc.
    required: false
    default: asc

  token:
    description: Optional GitHub token for authenticated API requests.
    required: false

outputs:
  count:
    description: Total number of starred repositories fetched.

  markdown-file:
    description: Path of the generated human-readable Markdown repository list.

  knowledge-base-file:
    description: Path of the generated AI-ready knowledge base.

runs:
  using: node24
  main: dist/index.js