name: "GitHub Starred Repository List"
description: "Fetch all starred repositories from a GitHub user and generate a customizable Markdown file"
author: "Deri Kurniawan"

branding:
  icon: "star"
  color: "yellow"

inputs:
  username:
    description: "GitHub username whose starred repositories will be fetched"
    required: true

  output-file:
    description: "Path and filename of the generated Markdown file"
    required: false
    default: "REPOSITORY_STAR_LIST.md"

  group-by:
    description: "Group repositories by none, language, or owner"
    required: false
    default: "language"

  sort-by:
    description: "Sort repositories by name, stars, or updated"
    required: false
    default: "name"

  sort-order:
    description: "Sort order: asc or desc"
    required: false
    default: "asc"

  format:
    description: "Output format: list or table"
    required: false
    default: "table"

  token:
    description: "GitHub token used to access the GitHub API"
    required: false
    default: ${{ github.token }}

outputs:
  count:
    description: "Total number of starred repositories fetched"

  file:
    description: "Path of the generated Markdown file"

runs:
  using: "node24"
  main: "dist/index.js"