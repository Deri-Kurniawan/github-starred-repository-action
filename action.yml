name: GitHub Starred Repository Knowledge Base

description: >
  Fetch all publicly accessible or authenticated GitHub starred repositories
  and generate a human-readable Markdown table and an AI-ready knowledge base.

author: Deri Kurniawan

branding:
  icon: star
  color: yellow

inputs:
  username:
    description: >
      GitHub username whose starred repositories should be fetched.
    required: true

  output-file:
    description: >
      Path and filename of the generated Markdown repository table.
    required: false
    default: REPOSITORY_STAR_LIST.md

  digest-file:
    description: >
      Path and filename of the generated AI-friendly repository knowledge base.
    required: false
    default: REPOSITORY_STAR_DIGEST.md

  sort-by:
    description: >
      Sort repositories by name, stars, or updated.
    required: false
    default: name

  sort-order:
    description: >
      Sort order: asc or desc.
    required: false
    default: asc

  token:
    description: >
      Optional GitHub token. If provided, authenticated API requests are used.
      Without a token, the Action fetches publicly accessible starred repositories.
    required: false

outputs:
  count:
    description: Total number of starred repositories fetched.

  file:
    description: Path of the generated Markdown table.

  digest-file:
    description: Path of the generated AI-friendly digest.

runs:
  using: node24
  main: dist/index.js